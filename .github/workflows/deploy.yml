name: Deploy Preventivi Pro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pin the runner image instead of following ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies (with network retries)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            echo "Installazione dipendenze, tentativo ${attempt}/3"
            if npm install --no-audit --no-fund --prefer-online --fetch-retries=5 --fetch-timeout=120000; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          if [ "$installed" != "true" ]; then
            echo "ERRORE: impossibile installare le dipendenze npm dopo 3 tentativi."
            exit 1
          fi
          npm ls --depth=0
          npm ls tesseract.js --depth=0

      - name: Run automated tests
        run: npm test

      - name: Compile React application with Vite
        run: npm run build

      - name: Verify compiled website
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -size +0c | grep -q .
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "ERRORE: nell'HTML pubblicato è rimasto il riferimento sorgente a src/main.jsx."
            exit 1
          fi
          test -s dist/pdf.worker.min.mjs
          worker_bytes=$(wc -c < dist/pdf.worker.min.mjs)
          if [ "$worker_bytes" -lt 100000 ]; then
            echo "ERRORE: dist/pdf.worker.min.mjs è troppo piccolo; potrebbe essere una pagina HTML di errore."
            exit 1
          fi
          first_char=$(head -c 1 dist/pdf.worker.min.mjs)
          if [ "$first_char" = "<" ]; then
            echo "ERRORE: il worker PDF contiene HTML invece di JavaScript."
            exit 1
          fi
          echo "Verifica build completata: HTML, asset React e worker PDF presenti."

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
