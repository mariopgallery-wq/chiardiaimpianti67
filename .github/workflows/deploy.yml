name: Deploy Preventivi Pro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (with network retries)
        timeout-minutes: 15
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Installazione dipendenze, tentativo ${attempt}/3"
            if npm install --no-audit --no-fund --prefer-online --fetch-retries=5 --fetch-timeout=120000; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Errore: impossibile installare le dipendenze npm dopo 3 tentativi."
              exit 1
            fi
            sleep 10
          done
          npm ls --depth=0

      - name: Run tests
        run: npm test

      - name: Compile React application with Vite
        run: npm run build

      - name: Verify compiled files
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -size +0c | grep -q .
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "Errore: React non è stato compilato"
            exit 1
          fi

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
