
name: Deploy Preventivi Pro to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        timeout-minutes: 15
        run: npm install --no-audit --no-fund --prefer-online --fetch-retries=5 --fetch-timeout=120000

      - name: Run automated tests
        run: npm test

      - name: Compile React application
        run: npm run build

      - name: Verify compiled website
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -size +0c | grep -q .
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "ERRORE: riferimento sorgente non compilato."
            exit 1
          fi
          worker_file=$(find dist/assets -maxdepth 1 -type f -name 'pdf.worker*.mjs' -size +100k -print -quit)
          if [ -z "$worker_file" ]; then
            echo "ERRORE: worker PDF.js non trovato."
            exit 1
          fi
          first_char=$(head -c 1 "$worker_file")
          if [ "$first_char" = "<" ]; then
            echo "ERRORE: il worker PDF contiene HTML."
            exit 1
          fi
          echo "Verifica completata."

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
